<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="OmniDesk AI — unified omnichannel customer conversations powered by AI agents." />
    <meta name="theme-color" content="#244aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Preconnect to the API + WS origins so DNS + TLS land before the
         first request goes out.  Both URLs come from the build-time env;
         the placeholders here use the production defaults. -->
    <link rel="preconnect" href="https://api.omnidesk.ai" crossorigin />
    <link rel="preconnect" href="https://rsms.me" crossorigin />
    <link rel="dns-prefetch" href="https://api.omnidesk.ai" />

    <!-- Inter font with explicit display=swap so we never block paint -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://rsms.me/inter/inter.css" /></noscript>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="OmniDesk AI" />
    <meta property="og:description" content="Unified omnichannel customer conversations powered by AI." />
    <meta property="og:type" content="website" />

    <title>OmniDesk AI</title>

    <!-- Pre-paint dark-class application: avoids the white-flash on
         reload when the user has dark mode set.  Reads the same
         `omnidesk.theme` key the useTheme composable writes to. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('omnidesk.theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (_) {}
      })()
    </script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="app" class="h-full"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui">
        OmniDesk AI requires JavaScript to run. Please enable it in your browser.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
